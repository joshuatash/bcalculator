<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff9500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="jstyle.css">
  <title>Calculator</title>
</head>

<body>
  <div class="calculator">
    <input type="text" id="display" placeholder="0" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="clear" onclick="deleteOne()">⌫</button>
      <button class="func" onclick="percent()">%</button>
      <button class="op" onclick="append('/')">÷</button>

      <button class="num" onclick="append('7')">7</button>
      <button class="num" onclick="append('8')">8</button>
      <button class="num" onclick="append('9')">9</button>
      <button class="op" onclick="append('*')">×</button>

      <button class="num" onclick="append('4')">4</button>
      <button class="num" onclick="append('5')">5</button>
      <button class="num" onclick="append('6')">6</button>
      <button class="op" onclick="append('-')">−</button>

      <button class="num" onclick="append('1')">1</button>
      <button class="num" onclick="append('2')">2</button>
      <button class="num" onclick="append('3')">3</button>
      <button class="op" onclick="append('+')">+</button>

      <button class="num zero" onclick="append('0')">0</button>
      <button class="num" onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    const display = document.getElementById("display");
    function append(v) { if (display.value === "Error") display.value = ""; display.value += v; autoResize(); }
    function clearDisplay() { display.value = ""; autoResize(); }
    function deleteOne() { display.value = display.value.slice(0, -1); autoResize(); }
    function percent() { if (!isNaN(display.value) && display.value !== "") display.value = parseFloat(display.value) / 100; else display.value += "%"; autoResize(); }
    function calculate() {
      try {
        let expr = display.value.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
        expr = expr.replace(/(\d+(\.\d+)?)\s*([\+\-])\s*\((\d+(\.\d+)?)\/100\)/g, (m, n1, _, op, n2) => n1 + op + "(" + n1 + "*" + n2 + "/100)");
        let r = eval(expr); display.value = Number.isInteger(r) ? r : parseFloat(r.toFixed(8)); autoResize();
      } catch { display.value = "Error"; }
    }
    function autoResize() {
      // shrink font if number is too long
      if (display.value.length > 9) { display.style.fontSize = "10vw"; }
      else { display.style.fontSize = ""; }
    }
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  </script>
</body>

</html>
